version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Match pnpm's default minimumReleaseAge (1 day) so CI installs don't reject fresh releases.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    # A week's minor and patch bumps land as one PR, so one snapshot run covers them; majors
    # still come one at a time.
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
